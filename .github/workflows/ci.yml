# Integración continua: en cada push y pull request GitHub revisa el código,
# corre las pruebas y construye la imagen Docker. Si algo falla, el commit
# queda marcado en rojo.
#
#   calidad ─┐
#            ├─> docker (solo si los dos primeros pasan)
#   pruebas ─┘

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

# El workflow solo lee el repositorio; no necesita más permisos
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.5.1"  # la misma versión que generó poetry.lock

jobs:
  calidad:
    name: Lint, formato y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry # reutiliza las dependencias entre ejecuciones

      - name: Instalar dependencias
        # --all-extras: también el extra "ml" (scikit-learn, pandas), que usan
        # analitica/prediccion.py y sus pruebas
        run: poetry install --no-interaction --all-extras

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Ruff (formato)
        run: poetry run ruff format --check .

      - name: Mypy (tipos)
        run: poetry run mypy

  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    env:
      # Secreto fijo solo para las pruebas (no es el de producción)
      LIBRERIA_JWT_SECRETO: secreto-de-ci-solo-para-pruebas-0123456789
    steps:
      - uses: actions/checkout@v6

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Instalar dependencias
        # --all-extras: también el extra "ml" (scikit-learn, pandas), que usan
        # analitica/prediccion.py y sus pruebas
        run: poetry install --no-interaction --all-extras

      - name: Pytest con cobertura
        run: poetry run pytest --cov=libreria --cov-report=term --cov-report=xml

      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cobertura
          path: coverage.xml

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [calidad, pruebas]
    steps:
      - uses: actions/checkout@v6

      - name: Construir la imagen
        run: docker build -t libreria-api:ci .

      # Prueba de humo: la imagen arranca, aplica las migraciones y responde
      - name: Levantar el contenedor
        run: |
          docker run -d --name api -p 8000:8000 \
            -e LIBRERIA_JWT_SECRETO=secreto-de-ci-solo-para-pruebas-0123456789 \
            libreria-api:ci

      - name: Esperar a que responda
        run: |
          for intento in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/docs > /dev/null; then
              echo "La API respondió en el intento $intento"
              exit 0
            fi
            sleep 1
          done
          echo "La API no respondió a tiempo"
          exit 1

      - name: Probar endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/libros/ | tee libros.json
          test "$(cat libros.json)" = "[]"   # base nueva: sin libros
          # sin token, los reportes deben responder 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/reportes/usuarios)" = "401"

      - name: Logs del contenedor
        if: always()
        run: docker logs api
